<!DOCTYPE html>
<html>
<head>
    <title>Sudoku Arena PRO</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="pro.css">
</head>
<body>

<div class="app">

    <h1>Sudoku Arena PRO 🏆</h1>
    <div id="timer">Tempo: 90:00</div>

    <div id="login">
        <input type="text" id="name" placeholder="Nome giocatore">
        <input type="password" id="password" placeholder="Password docente">
        <button onclick="joinGame()">Entra</button>
    </div>

    <button id="startBtn" style="display:none;" onclick="startGame()">Avvia Torneo</button>

    <p id="waiting" style="display:none;">In attesa del docente...</p>

    <div id="game"></div>

    <h2>Classifica</h2>
    <div id="leaderboard"></div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="pro.js"></script>

</body>
</html>
