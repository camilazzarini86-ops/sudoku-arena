<!DOCTYPE html>
<html>
<head>
    <title>Sudoku Arena</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

    <div class="header">
        <h1>Sudoku Arena 🏆</h1>
        <div id="timer">Tempo: 90:00</div>
    </div>

    <div>
        <div id="login" style="margin-bottom:15px;">
            <input type="text" id="name" placeholder="Nome giocatore">
            <button onclick="joinGame()">Entra</button>
            <button onclick="startGame()">Avvia</button>
        </div>

        <div id="game"></div>
    </div>

    <div class="leaderboard">
        <h2>Classifica</h2>
        <div id="leaderboard"></div>
    </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="game.js"></script>

</body>
</html>
